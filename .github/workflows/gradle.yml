name: selec CI/CD

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # DEVELOP 용 환경 설정
      - name: Set Environment for DEVELOP
        if: github.ref == 'refs/heads/develop'
        run: |
          mkdir -p config
          echo "${{ secrets.CONFIG_DEVELOP_ENV }}" | base64 --decode > config/develop.env
          echo "${{ secrets.CONFIG_DEFAULT_ENV_DEVELOP }}" | base64 --decode > config/default.env

      # PRODUCTION 용 환경 설정
      # - name: Set Environment for PRODUCTION
      #   if: github.ref == 'refs/heads/master'
      #   run: |
      #     mkdir -p config
      #     echo "${{ secrets.CONFIG_PRODUCTION_ENV }}" | base64 --decode > config/production.env
      #     echo "${{ secrets.CONFIG_DEFAULT_ENV_PROD }}" | base64 --decode > config/default.env

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image (DEVELOP)
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/selec-develop:latest
            ${{ secrets.DOCKER_USERNAME }}/selec-develop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Build and Push Docker Image (PRODUCTION)
      #   if: github.ref == 'refs/heads/master'
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKER_USERNAME }}/selec-prod:latest
      #       ${{ secrets.DOCKER_USERNAME }}/selec-prod:${{ github.sha }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Set Docker permissions
        run: |
          sudo usermod -aG docker $USER
          sudo chown $USER /var/run/docker.sock
          newgrp docker

      - name: Clean up Docker to free space
        run: |
          sudo docker container prune -f
          sudo docker image prune -a -f
          sudo docker volume prune -f
          sudo docker network prune -f
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get autoremove

      # 배포할 서버 선택 (develop → 테스트 서버, master → 운영 서버)
      - name: Deploy to DEVELOP EC2
        if: github.ref == 'refs/heads/develop'
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ secrets.DEVELOP_EC2_IP }} << 'EOF'
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/selec-develop:latest

            sudo docker stop selec-develop || true
            sudo docker rm selec-develop || true

            sudo docker run -d \
              --name selec-develop \
              --restart always \
              -p 8000:8000 \
              ${{ secrets.DOCKER_USERNAME }}/selec-develop:latest

            sudo docker image prune -f
          EOF

      # - name: Deploy to PROD EC2
      #   if: github.ref == 'refs/heads/master'
      #   run: |
      #     ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ secrets.PROD_EC2_IP }} << 'EOF'
      #       sudo docker pull ${{ secrets.DOCKER_USERNAME }}/selec-prod:latest
      #
      #       sudo docker stop selec-prod || true
      #       sudo docker rm selec-prod || true
      #
      #       sudo docker run -d \
      #         --name selec-prod \
      #         --restart always \
      #         -p 8000:8000 \
      #         ${{ secrets.DOCKER_USERNAME }}/selec-prod:latest
      #
      #       sudo docker image prune -f
      #     EOF