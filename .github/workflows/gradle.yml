name: selec CI/CD

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

#      DEVELOP 용 환경 설정
#      - name: Set Environment for DEVELOP
#        if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop'
#        run: |
#          mkdir -p config
#          echo "${{ secrets.CONFIG_DEVELOP_ENV }}" | base64 --decode > config/develop.env
#          echo "${{ secrets.CONFIG_DEFAULT_ENV }}" | base64 --decode > config/default.env

      # PRODUCTION 용 환경 설정
      - name: Set Environment for PRODUCTION
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p config
          echo "${{ secrets.CONFIG_PRODUCTION_ENV }}" | base64 --decode > config/production.env
          echo "${{ secrets.CONFIG_DEFAULT_ENV_PROD }}" | base64 --decode > config/default.env

      # Python 의존성 설치
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Python 테스트 실행
      - name: Run Tests
        run: |
          python -m pytest tests/ || echo "No tests found, continuing..."

      # Docker Config
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      #      - name: Build and Push Docker Image (DEVELOP)
      #        if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop'
      #        env:
      #          NAME: ${{ secrets.DOCKER_USERNAME }}
      #          REPO: adedge-develop
      #        run: |
      #          docker build -t $REPO .
      #          docker tag $REPO:latest $NAME/$REPO:latest
      #          docker push $NAME/$REPO:latest

      - name: Build and Push Docker Image (PRODUCTION)
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        env:
          NAME: ${{ secrets.DOCKER_USERNAME }}
          REPO: selec-prod
        run: |
          docker build -t $REPO .
          docker tag $REPO:latest $NAME/$REPO:latest
          docker push $NAME/$REPO:latest

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Set Docker permissions
        run: |
          sudo usermod -aG docker $USER
          sudo chown $USER /var/run/docker.sock
          newgrp docker

      - name: Clean up Docker to free space
        run: |
          sudo docker container prune -f
          sudo docker image prune -a -f
          sudo docker volume prune -f
          sudo docker network prune -f
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get autoremove

      # 배포할 서버 선택 (develop → 테스트 서버, master → 운영 서버)
      #      - name: Deploy to DEVELOP EC2
      #        if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop'
      #        run: |
      #          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ secrets.TEST_EC2_IP }} << 'EOF'
      #            sudo docker container prune -f
      #            sudo docker image prune -a -f
      #            sudo docker volume prune -f
      #            sudo docker network prune -f
      #
      #            sudo docker ps -q --filter "name=adedge-develop" | grep -q . && sudo docker stop "adedge-develop" && sudo docker rm "adedge-develop"
      #            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/adedge-develop:latest
      #            sudo docker run -d --name adedge-develop --rm -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/adedge-develop:latest
      #          EOF

      - name: Deploy to PROD EC2
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ secrets.PROD_EC2_IP }} << 'EOF'
            sudo docker container prune -f
            sudo docker image prune -a -f
            sudo docker volume prune -f
            sudo docker network prune -f

            sudo docker ps -q --filter "name=selec-prod" | grep -q . && sudo docker stop "selec-prod" && sudo docker rm "selec-prod"
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/selec-prod:latest
            sudo docker run -d --name selec-prod --rm -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/selec-prod:latest
          EOF
