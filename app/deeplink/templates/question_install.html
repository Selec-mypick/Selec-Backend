<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Selec</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #f4f6f8;
            color: #17191f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
        }

        main {
            width: min(100%, 360px);
        }

        .status {
            text-align: center;
            margin-bottom: 28px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 14px;
            border: 3px solid #dde3ec;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status-title {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            color: #17191f;
        }

        .status-desc {
            margin: 6px 0 0;
            font-size: 14px;
            color: #8a92a2;
        }

        .guide {
            background: #ffffff;
            border: 1px solid #e4e9f0;
            border-radius: 12px;
            padding: 20px;
        }

        .guide-title {
            margin: 0 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: #8a92a2;
        }

        .steps {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 14px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-num {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #eef2ff;
            color: #3157d5;
            font-size: 12px;
            font-weight: 700;
            display: grid;
            place-items: center;
        }

        .step-text {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
            color: #344054;
            line-height: 1.4;
        }

        .copy-btn {
            flex-shrink: 0;
            padding: 7px 14px;
            border: 1px solid #d7deea;
            border-radius: 8px;
            background: #ffffff;
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .copy-btn:active {
            background: #f4f6f8;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<main>
    <div class="status">
        <div class="spinner" aria-hidden="true"></div>
        <p class="status-title">이동 중</p>
        <p class="status-desc">잠시만 기다려주세요</p>
    </div>

    <section class="guide" aria-label="링크 열기 안내">
        <p class="guide-title">이동이 안 될 때</p>
        <ol class="steps">
            <li class="step">
                <span class="step-num">1</span>
                <span class="step-text">링크 복사</span>
                <button class="copy-btn" type="button" id="copyBtn">복사</button>
            </li>
            <li class="step">
                <span class="step-num">2</span>
                <span class="step-text" id="browserStep">Safari에서 열기</span>
            </li>
        </ol>
    </section>
</main>
<script>
    const userAgent = navigator.userAgent.toLowerCase();
    const isAndroid = userAgent.includes("android");
    const isIOS = /iphone|ipad|ipod/.test(userAgent);

    const androidIntentUrl = $android_intent_url;
    const webUrl = $web_url;
    const shareUrl = $share_url;

    document.getElementById("browserStep").textContent =
        isIOS ? "Safari에서 열기" : "Chrome에서 열기";

    document.getElementById("copyBtn").addEventListener("click", async () => {
        const btn = document.getElementById("copyBtn");
        try {
            await navigator.clipboard.writeText(shareUrl);
            btn.textContent = "완료";
            setTimeout(() => { btn.textContent = "복사"; }, 1500);
        } catch {
            btn.textContent = "실패";
            setTimeout(() => { btn.textContent = "복사"; }, 1500);
        }
    });

    if (isAndroid) {
        window.location.replace(androidIntentUrl);
    } else if (isIOS) {
        window.location.replace(webUrl);
    } else {
        window.location.replace(webUrl);
    }
</script>
</body>
</html>
