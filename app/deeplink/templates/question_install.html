<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Selec 앱에서 투표하기</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #f5f7fb;
            color: #171a22;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
        }

        main {
            width: min(100%, 430px);
        }

        .hero {
            text-align: center;
            padding: 8px 0 0;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            border-radius: 22px;
            background: #111827;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            box-shadow: 0 18px 36px rgba(17, 24, 39, 0.18);
        }

        h1 {
            margin: 0;
            font-size: 29px;
            line-height: 1.18;
            letter-spacing: 0;
        }

        .copy {
            margin: 14px auto 0;
            max-width: 330px;
            color: #606779;
            font-size: 16px;
            line-height: 1.55;
        }

        .panel {
            margin-top: 26px;
            padding: 18px;
            border: 1px solid #dfe4ee;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 18px 44px rgba(34, 45, 68, 0.08);
        }

        .platform {
            margin: 0;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
        }

        .question-id {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            background: #f8fafc;
            color: #697184;
            font-size: 12px;
            line-height: 1.4;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .actions {
            margin-top: 18px;
            display: grid;
            gap: 10px;
        }

        a {
            min-height: 54px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: 750;
        }

        .primary {
            background: #2563eb;
            color: #ffffff;
        }

        .note {
            margin: 16px auto 0;
            max-width: 320px;
            color: #8a92a3;
            font-size: 13px;
            line-height: 1.48;
            text-align: center;
        }

        @media (max-width: 360px) {
            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            h1 {
                font-size: 26px;
            }

            .copy {
                font-size: 15px;
            }

            .panel {
                padding: 16px;
            }
        }

        @media (min-width: 720px) {
            main {
                width: 460px;
            }
        }
    </style>
</head>
<body>
<main>
    <section class="hero" aria-labelledby="page-title">
        <div class="logo" aria-hidden="true">S</div>
        <h1 id="page-title">Selec 앱에서<br>투표를 확인하세요</h1>
        <p class="copy">공유받은 질문은 Selec 앱에서 열고 바로 투표할 수 있습니다.</p>
    </section>

    <section class="panel" aria-label="앱 설치 안내">
        <p class="platform">$platform_message</p>
        <div class="question-id">질문 ID<br>$question_id</div>
        <div class="actions">
            <a class="primary" href="$primary_install_url">$primary_button_label</a>
        </div>
        <p class="note">앱 설치 후 같은 링크를 다시 열면 질문 화면으로 이동합니다.</p>
    </section>
</main>
</body>
</html>
