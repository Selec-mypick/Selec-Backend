<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Selec 앱에서 열기</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #f4f6f8;
            color: #17191f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
        }

        main {
            width: min(100%, 430px);
        }

        .app-mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            border-radius: 18px;
            background: #111318;
            color: #ffffff;
            display: grid;
            place-items: center;
            font-size: 31px;
            font-weight: 800;
            letter-spacing: 0;
            box-shadow: 0 16px 34px rgba(17, 19, 24, 0.18);
        }

        .headline {
            margin: 0;
            font-size: 28px;
            line-height: 1.22;
            letter-spacing: 0;
            text-align: center;
        }

        .description {
            margin: 14px auto 0;
            max-width: 342px;
            color: #5f6673;
            font-size: 16px;
            line-height: 1.55;
            text-align: center;
        }

        .install-card {
            margin-top: 28px;
            border: 1px solid #dde3ec;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 18px 46px rgba(22, 30, 45, 0.08);
            overflow: hidden;
        }

        .guide {
            padding: 18px;
        }

        .platform {
            margin: 0;
            color: #475066;
            font-size: 15px;
            line-height: 1.55;
        }

        .primary-action {
            margin-top: 16px;
            min-height: 54px;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
        }

        .steps {
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .steps li {
            display: grid;
            grid-template-columns: 24px 1fr;
            gap: 10px;
            color: #626b7d;
            font-size: 13px;
            line-height: 1.45;
        }

        .step-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #eef2ff;
            color: #3157d5;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 800;
        }

        .footer-note {
            margin: 16px auto 0;
            max-width: 330px;
            color: #8a92a2;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 360px) {
            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            .headline {
                font-size: 25px;
            }

            .description,
            .platform {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
<main>
    <div class="app-mark" aria-hidden="true">S</div>
    <h1 class="headline">Selec 앱에서<br>공유된 투표를 열어보세요</h1>
    <p class="description">앱이 설치되어 있으면 질문 화면으로 바로 이동합니다. 설치가 필요하면 아래 버튼으로 앱을 먼저 설치해주세요.</p>

    <section class="install-card" aria-label="Selec 앱 이동 안내">
        <div class="guide">
            <p class="platform">$platform_message</p>
            <a class="primary-action" href="$primary_install_url">$primary_button_label</a>
            <ol class="steps">
                <li>
                    <span class="step-number">1</span>
                    <span>앱을 설치하거나 업데이트합니다.</span>
                </li>
                <li>
                    <span class="step-number">2</span>
                    <span>설치가 끝나면 공유받은 링크를 다시 열어 질문으로 이동합니다.</span>
                </li>
            </ol>
        </div>
    </section>

    <p class="footer-note">앱이 이미 설치되어 있는데 이동하지 않는다면 브라우저의 열기 메뉴에서 Selec 앱을 선택해주세요.</p>
</main>
</body>
</html>
