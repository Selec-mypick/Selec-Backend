<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Selec</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #f4f6f8;
            color: #17191f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
        }

        main {
            width: min(100%, 430px);
            text-align: center;
        }

        .app-mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            border-radius: 18px;
            background: #111318;
            color: #ffffff;
            display: grid;
            place-items: center;
            font-size: 31px;
            font-weight: 800;
            box-shadow: 0 16px 34px rgba(17, 19, 24, 0.18);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.3;
        }

        p {
            margin: 14px auto 0;
            max-width: 342px;
            color: #5f6673;
            font-size: 16px;
            line-height: 1.55;
        }
    </style>
</head>
<body>
<main>
    <div class="app-mark" aria-hidden="true">S</div>
    <h1>모바일에서만 제공하는 서비스입니다</h1>
    <p>Selec 공유 링크는 스마트폰에서 열어주세요.</p>
</main>
</body>
</html>
